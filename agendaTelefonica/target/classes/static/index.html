<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>📒 Agenda de Contatos</h1>
        
        <!-- Formulário de cadastro -->
        <div class="form-section">
            <h2>Novo Contato</h2>
            <form id="contatoForm">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite o nome">
                </div>
                
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
                </div>
                
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
        </div>
        
        <!-- Botão para listar contatos -->
        <div class="list-section">
            <button id="btnListar" class="btn-listar">📋 Listar Contatos</button>
            
            <!-- Área para exibir os contatos -->
            <div id="contatosArea" class="contatos-area">
                <h3>Contatos Cadastrados:</h3>
                <div id="resposta" class="resposta">
                    Aguardando...
                </div>
            </div>
        </div>
    </div>
    
    <script src="/app.js"></script>
</body>
</html>
